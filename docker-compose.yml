services:
  # ============================================================================
  # 1. Base de Datos PostgreSQL 17 - cajadb
  # Inicializa automáticamente con setup_cajadb_maestra.sql (13 tablas y vistas)
  # ============================================================================
  db:
    image: postgres:17-alpine
    container_name: tecnm_caja_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cajadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./setup_cajadb_maestra.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - app-network

  # ============================================================================
  # 2. Backend Web API (.NET 10 / C#)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tecnm_caja_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=cajadb;Username=postgres;Password=postgrespassword123
      - Jwt__SecretKey=TecNM_Monclova_SuperSecretKey_2026_Min32Bytes!
      - Jwt__Issuer=TecNM.Api
      - Jwt__Audience=TecNM.Frontend
      - Jwt__LifetimeHours=8
      - Cors__AllowedOrigin=http://localhost:6030
    ports:
      - "6040:8080"
    networks:
      - app-network
    depends_on:
      - db

  # ============================================================================
  # 3. Frontend SPA (Vue 3 + Vite + TypeScript)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tecnm_caja_frontend
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    ports:
      - "6030:6030"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
