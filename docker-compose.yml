services:
  # ============================================================================
  # 1. Backend Web API (.NET 10 / C#)
  #
  # ARQUITECTURA DEL EQUIPO:
  #   - Base de Datos: PostgreSQL 18 instalado localmente en Windows (NO Docker).
  #                    Tu compañera DB la administra en su máquina local.
  #   - Backend + Frontend: Corren en Docker en las laptops del equipo.
  #
  # La variable host.docker.internal permite que el backend dentro de Docker
  # alcance el PostgreSQL 18 que corre en Windows (fuera de Docker).
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tecnm_caja_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # -------------------------------------------------------------------------
      # Conexión a PostgreSQL 18 LOCAL (Windows) desde dentro de Docker.
      # host.docker.internal resuelve a la IP del equipo anfitrión automáticamente.
      # El nombre de la base de datos es 'cajadb' (creada por la especialista DB).
      # -------------------------------------------------------------------------
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=cajadb;Username=postgres;Password=postgrespassword123
      - Jwt__SecretKey=TecNM_Monclova_SuperSecretKey_2026_Min32Bytes!
      - Jwt__Issuer=TecNM.Api
      - Jwt__Audience=TecNM.Frontend
      - Jwt__LifetimeHours=8
      - Cors__AllowedOrigin=http://localhost:5173
    ports:
      - "7001:8080"
    networks:
      - app-network

  # ============================================================================
  # 2. Frontend SPA (Vue 3 + Vite + TypeScript)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tecnm_caja_frontend
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=http://localhost:7001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
